<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="3° Técnico em Desenvolvimento de Sistemas"
    />

    <title>3° Técnico em Desenvolvimento de Sistemas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="hero">
      <div class="eyebrow">
        <span class="status-dot"></span>
        sistemas online · 2026
      </div>

      <div class="terminal-card">
        <div class="terminal-topbar" aria-hidden="true">
          <div class="window-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <span class="terminal-label">classroom.exe</span>
          <span class="terminal-index">01 / 01</span>
        </div>

        <div class="terminal-content">
          <p class="prompt-line">
            <span class="prompt-symbol">&gt;</span>
            iniciar_apresentacao<span class="blink">_</span>
          </p>

          <h1 aria-live="polite">
            <span id="typed-text"></span>
            <span class="type-cursor" aria-hidden="true"></span>
          </h1>

          <p class="supporting-copy">
            Onde ideias ganham lógica, código e forma.
          </p>

          <div class="card-footer">
            <span>desenvolvimento de sistemas</span>
            <span class="footer-line"></span>
            <span>aprenda · crie · transforme</span>
          </div>
        </div>
      </div>

      <p class="scroll-hint">
        <span class="scroll-arrow">↓</span>
        pressione para reiniciar a animação
      </p>
    </main>

    <footer class="site-footer">
      <span>3° TDS</span>
      <span class="footer-separator">/</span>
      <span>construindo o próximo nível</span>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
